name: Actualizar catálogo del launcher

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Etiqueta de la release que contiene el ZIP
        required: true
        type: string

permissions:
  contents: write

jobs:
  actualizar-catalogo:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'darkness-desafiov1-')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Comprobar versión y localizar el ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail

          PREFIX="darkness-desafiov1-"
          if [[ "$RELEASE_TAG" != "$PREFIX"* ]]; then
            echo "La etiqueta debe empezar con $PREFIX (ejemplo: darkness-desafiov1-1.0.1)." >&2
            exit 1
          fi

          VERSION="${RELEASE_TAG#"$PREFIX"}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "La versión debe tener formato X.Y.Z, por ejemplo 1.0.1." >&2
            exit 1
          fi

          ASSETS="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name | select(endswith(".zip"))] | .[]')"
          COUNT="$(printf '%s\n' "$ASSETS" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [[ "$COUNT" != "1" ]]; then
            echo "La release debe tener exactamente un archivo .zip adjunto; encontré $COUNT." >&2
            exit 1
          fi

          ASSET_NAME="$ASSETS"
          case "$ASSET_NAME" in
            "desafiov1-$VERSION.zip"|"desafiov1-$VERSION-"*.zip) ;;
            *)
              echo "El ZIP debe llamarse desafiov1-$VERSION.zip (también se permite un sufijo de hash). Encontré: $ASSET_NAME" >&2
              exit 1
              ;;
          esac

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Descargar ZIP y calcular SHA-256
        id: checksum
        shell: bash
        env:
          ASSET_NAME: ${{ steps.package.outputs.asset_name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/modpack"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET_NAME" \
            --dir "$RUNNER_TEMP/modpack"
          SHA256="$(sha256sum "$RUNNER_TEMP/modpack/$ASSET_NAME" | cut -d ' ' -f 1)"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Actualizar URL, versión y checksum del catálogo
        env:
          PACK_VERSION: ${{ steps.package.outputs.version }}
          ASSET_NAME: ${{ steps.package.outputs.asset_name }}
          PACKAGE_SHA256: ${{ steps.checksum.outputs.sha256 }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote

          catalog_path = Path("catalog.json")
          catalog = json.loads(catalog_path.read_text(encoding="utf-8"))
          matches = [item for item in catalog.get("instances", []) if item.get("id") == "desafio1"]
          if len(matches) != 1:
              raise SystemExit("Se esperaba encontrar exactamente una instancia con id desafio1 en catalog.json.")

          instance = matches[0]
          tag = os.environ["RELEASE_TAG"]
          asset = os.environ["ASSET_NAME"]
          instance["package_url"] = (
              f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/"
              f"{quote(tag, safe='')}/{quote(asset, safe='')}"
          )
          instance["sha256"] = os.environ["PACKAGE_SHA256"].lower()
          instance["release"] = os.environ["PACK_VERSION"]
          catalog_path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Guardar cambios en el catálogo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          if git diff --cached --quiet; then
            echo "El catálogo ya contiene estos datos; no hay cambios que guardar."
          else
            git commit -m "Actualizar pack del launcher a ${{ steps.package.outputs.version }}"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi

